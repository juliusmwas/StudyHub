<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Logo & Icons (update later with actual favicon logo) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1F4E79" />

    <!-- Mobile Responsive -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>StudyHub | Smart Learning & Live Study Rooms</title>
    <meta
      name="description"
      content="StudyHub is a collaborative e-learning platform offering interactive courses, study materials, and real-time online study sessions powered by Jitsi."
    />
    <meta name="keywords" content="study, e-learning, video learning, online course, virtual classroom, student collaboration, jitsi study rooms">
    <meta name="author" content="StudyHub Team" />

    <!-- Open Graph / Social Media Sharing -->
    <meta property="og:title" content="StudyHub | Smart Learning Platform" />
    <meta property="og:description" content="Join study rooms, access courses, and collaborate with peers in real-time." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:url" content="https://studyhub.com" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="StudyHub | Smart Learning Platform" />
    <meta name="twitter:description" content="Collaborative learning with live video study sessions." />
    <meta name="twitter:image" content="/og-image.png" />

    <!-- Fonts: Inter + Merriweather -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">

    <!-- Improve loading performance -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  </head>
  <body class="bg-[#F7F9FB] text-[#0D1B2A]">
    <noscript>You need to enable JavaScript to run this application.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
